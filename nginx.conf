server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Reverse proxy for Carfax Helix API, mirroring vercel.json's
    # "/api/carfax/(.*)" -> "https://helix.carfax.com/$1" rewrite and the
    # dev-time Vite proxy in vite.config.ts. This location's longer prefix
    # match takes precedence over the SPA catch-all below regardless of
    # declaration order, so /api/carfax/* is proxied and never falls
    # through to index.html.
    location /api/carfax/ {
        proxy_pass https://helix.carfax.com/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host helix.carfax.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: serve index.html for any non-API route so client-side
    # routing (react-router-dom BrowserRouter) works on deep links/refresh.
    location / {
        try_files $uri /index.html;
    }
}
